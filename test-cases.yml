- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    Ключевое слово = "Powder"
  steps:
    - Ввести ключевое слово в поле поиска
  expected-result: |
    Отображается список товаров, соответствующих запросу

- summary: |
    Поиск товара по несуществующему ключевому слову
  requirement: |
    При отсутствии товаров по запросу пользователь должен получить корректное сообщение
  prerequisites: |
    Открыта главная страница сайта магазина
  test-data: |
    Ключевое слово = "poweder"
  steps:
    - Ввести ключевое слово в поле поиска
  expected-result: |
    Отображается сообщение о том, что товар не найден

- summary: |
    Проверка базовой фильтрации товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница каталога
  test-data: |
    Фильтр категории = fragrances
  steps:
    - Выбрать фильтр категории
    - Применить фильтр
  expected-result: |
    Отображаются товары с учетом выбранного фильтра

- summary: |
    Проверка кнопки сброса фильтров категории
  requirement: |
    Пользователь должен иметь возможность сбросить фильтры и увидеть все товары без перезагрузки страницы
  prerequisites: |
    Открыта страница каталога
    Применён фильтр категории
  test-data: |
    Категория = fragrances
  steps:
    - Проверить наличие кнопки "Сбросить фильтр"
    - Нажать кнопку "Сбросить фильтр"
  expected-result: |
    Все товары отображаются, фильтр снят без перезагрузки страницы

- summary: |
    Проверка чекбокса "Производитель"
  requirement: |
    Применение фильтра показывает только товары выбранного производителя
  prerequisites: |
    Открыта страница товаров
  test-data: |
    Фильтр производителя = любой производитель
  steps:
    - Отметить чекбокс
  expected-result: |
    Применение фильтра показывает только товары выбранного производителя

- summary: |
    Все чекбоксы для фильтрации по производителю имеют названия
  requirement: |
    Все элементы фильтра по производителям должны быть подписаны и понятны пользователю
  prerequisites: |
    Открыта страница товаров
  test-data: |
    Фильтр производитель = каждый чек-бокс имеет название
  steps:
    - Проверить наличие подписи всех чекбоксов
  expected-result: |
    Все чекбоксы имеют названия

- summary: |
    Просмотр информации о товаре на главной странице магазина
  requirement: |
    На главной странице должны отображаться название товара, рейтинг, цена со скидкой и без скидки
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    - Нет
  steps:
    - Проверить что название товара, рейтинг, цена со скидкой и без скидки отображаются на главной странице
  expected-result: |
    Отображается название товара, рейтинг, цена со скидкой и без скидки

- summary: |
    Кликабельная область карточки товара
  requirement: |
    Кликабельная область карточки товара соответствует её визуальным границам
  prerequisites: |
    Открыта главная страница каталога
  test-data: |
    - Нет
  steps:
    - Открыть страницу каталога товаров
    - Навести курсор на карточку любого товара
    - Кликнуть внутри визуальных границ карточки товара
    - Вернуться в каталог
    - Кликнуть за пределами визуальных границ карточки, но в непосредственной близости к ней
  expected-result: |
    Переход на страницу товара происходит только при клике внутри визуальных границ карточки

- summary: |
    Просмотр карточки товара
  requirement: |
