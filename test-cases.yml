  test-data: |
    Браузеры: 
      - Google Chrome (последняя стабильная версия)  
      - Mozilla Firefox (последняя стабильная версия)
  steps:
    - Открыть сайт https://products-store.hexlet.app/ в Google Chrome
    - Перейти в каталог товаров
    - Применить фильтр к списку товаров
    - Открыть страницу товара
    - Добавить товар в корзину
    - Перейти в корзину
    - Перейти к оформлению заказа
    - Повторить все шаги в Mozilla Firefox
  expected-result: |
    Сайт корректно работает и отображается одинаково во всех браузерах, функциональность не отличается

