- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    Ключевое слово = "Powder"
  steps:
    - Ввести ключевое слово в поле поиска
    - Нажать кнопку поиска
  expected-result: |
    Отображается список товаров, соответствующих запросу

- summary: |
    Поиск товара по несуществующему ключевому слову
  requirement: |
    При отсутствии товаров по запросу пользователь должен получить корректное сообщение
  prerequisites: |
    Открыта главная страница сайта магазина
  test-data: |
    Ключевое слово = "poweder"
  steps:
    - Ввести ключевое слово в поле поиска
    - Нажать кнопку поиска
  expected-result: |
    Отображается сообщение о том, что товары не найдены

- summary: |
    Проверка базовой фильтрации товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница каталога
  test-data: |
    Фильтр категории = fragrances
  steps:
    - Выбрать фильтр категории
    - Применить фильтр
  expected-result: |
    Отображаются товары с учетом выбранного фильтра

- summary: |
    Проверка кнопки сброса фильтров категории
  requirement: |
    Пользователь должен иметь возможность сбросить фильтры и увидеть все товары без перезагрузки страницы
  prerequisites: |
    Открыта страница каталога
    Применён фильтр категории
  test-data: |
    Категория = fragrances
  steps:
    - Проверить наличие кнопки "Сбросить фильтр"
    - Нажать кнопку "Сбросить фильтр"
  expected-result: |
    Все товары отображаются, фильтр снят без перезагрузки страницы

- summary: |
    Проверка чекбокса "Производитель"
  requirement: |
    Все элементы фильтра по производителям должны быть подписаны и понятны пользователю
  prerequisites: |
    Открыта страница товаров
  test-data: |
    Фильтр производителя = любой производитель
  steps:
    - Отметить чекбокс
  expected-result: |
    Применение фильтра показывает только товары выбранного производителя

- summary: |
    Все чекбоксы имеют названия
  requirement: |
    Все элементы фильтра по производителям должны быть подписаны и понятны пользователю
  prerequisites: |
    Открыта страница товаров
  test-data: |
    Фильтр производитель = каждый чек-бокс имеет название
  steps:
    - Проверить наличие подписи всех чекбоксов
  expected-result: |
    Все чекбоксы имеют названия

- summary: |
    Просмотр карточки товара
  requirement: |
    Пользователь должен иметь возможность просматривать товары и подробную информацию о товаре
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Товар = любой
  steps:
    - Выбрать товар
    - Открыть карточку товара
  expected-result: |
    Отображается подробная информация о товаре

- summary: |
    Добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать её содержимое
  prerequisites: |
    Открыта карточка товара
  test-data: |
    Товар = любой
  steps:
    - Нажать "Добавить в корзину"
    - Перейти в корзину
  expected-result: |
    Товар отображается в корзине

- summary: |
    Переключение языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта любая страница сайта
  test-data: |
    Язык = English
  steps:
    - Открыть меню выбора языка
    - Выбрать английский язык
  expected-result: |
    Интерфейс отображается на английском языке

- summary: |
    Проверка локализации сайта
  requirement: |
    Сайт должен иметь локализацию на русский и английский языки
  prerequisites: |
    Открыта главная страница
  test-data: |
    Язык = Русский / English
  steps:
    - Переключить язык
  expected-result: |
    Все элементы интерфейса переведены корректно

- summary: |
    Проверка иконок языков интерфейса
  requirement: |
    Для каждого языка интерфейса есть соответствующая иконка
  prerequisites: |
    Открыта любая страница сайта
  test-data: |
    Язык = любой язык
  steps:
    - Открыть меню выбора языка
    - Проверить, что у каждого языка есть своя иконка
  expected-result: |
    У каждого языка отображается корректная иконка

- summary: |
    Проверка удобства использования и скорости работы
  requirement: |
    Сайт должен быть удобным и оптимизированным для скорости работы
  prerequisites: |
    Открыта главная страница
  test-data: |
    Нет
  steps:
    - Перейти между страницами сайта
  expected-result: |
    Страницы загружаются быстро, интерфейс понятен

- summary: |
    Проверка безопасности данных пользователя
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Открыть сайт по HTTPS
  test-data: |
    Нет
  steps:
    - Проверить протокол соединения
  expected-result: |
    Используется защищённое соединение HTTPS

- summary: |
    Проверка мобильной версии сайта
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    Открыт сайт на мобильном устройстве
  test-data: |
    Нет
  steps:
    - Открыть сайт
  expected-result: |
    Сайт открывается на мобильном устройстве

- summary: |
    Совместимость с браузерами
  requirement: |
    Сайт должен корректно работать в последних версиях браузеров
  prerequisites: |
    Установлены актуальные браузеры
  test-data: |
    Браузеры = Chrome, Firefox
  steps:
    - Открыть сайт в разных браузерах
  expected-result: |
    Сайт работает одинаково корректно во всех браузерах

- summary: |
    Обработка большого количества трафика
  requirement: |
    Сайт должен обрабатывать большое количество трафика
  prerequisites: |
    Имитирована высокая нагрузка
  test-data: |
    Нет
  steps:
    - Выполнить нагрузочное тестирование
  expected-result: |
    Сайт остаётся доступным и работоспособным

- summary: |
    Доступность сайта без VPN
  requirement: |
    Сайт должен быть доступен без использования VPN
  prerequisites: |
    VPN отключён
  test-data: |
    Нет
  steps:
    - Открыть сайт
  expected-result: |
    Сайт открывается без ограничений

- summary: |
    Сохранение корзины в рамках сессии
  requirement: |
    Корзина должна сохраняться в рамках одной сессии браузера
  prerequisites: |
    В корзину добавлен товар
  test-data: |
    Нет
  steps:
    - Обновить страницу
  expected-result: |
    Товары в корзине сохраняются

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалять товар из корзины
  prerequisites: |
    В корзине есть товар
  test-data: |
    Нет
  steps:
    - Нажать "Удалить"
  expected-result: |
    Товар удалён из корзины

- summary: |
    Изменение количества товара
  requirement: |
    Пользователь должен иметь возможность изменить количество товара в корзине
  prerequisites: |
    В корзине есть товар
  test-data: |
    Количество = 2
  steps:
    - Изменить количество
  expected-result: |
    Итоговая сумма пересчитана корректно

- summary: |
    Проверка отображения количества товаров в корзине
  requirement: |
    В корзине должно отображаться только количество товара, которое добавил пользователь
  prerequisites: |
    Добавить любой товар в корзину
  test-data: |
    Добавить любой товар в корзину
  steps:
    - Перейти в корзину
    - Проверить отображаемое количество для каждого добавленного товара
    - Проверить, что отображаться только количество товара, которое добавил пользователь
  expected-result: |
    - Для каждого товара отображается только количество, которое добавил пользователь

- summary: |
    Переход к оформлению заказа
  requirement: |
    Пользователь должен иметь возможность перейти к оформлению заказа
  prerequisites: |
    В корзине есть товар
  test-data: |
    Нет
  steps:
    - Нажать "Оформить заказ"
  expected-result: |
    Заказ успешно оформлен

- summary: |
    Отображение цен со скидкой
  requirement: |
    Цены со скидкой и без скидки должны отображаться корректно
  prerequisites: |
    Есть товар со скидкой
  test-data: |
    Нет
  steps:
    - Открыть карточку товара
  expected-result: |
    Отображаются старая и новая цена

- summary: |
    Обработка ошибок
  requirement: |
    Ошибки должны отображаться корректно и понятно для пользователя
  prerequisites: |
    Нет товаров по запросу
  test-data: |
    Запрос = "xxxxx"
  steps:
    - Выполнить поиск
  expected-result: |
    Отображается понятное сообщение об ошибке

- summary: |
    Обработка ошибок в интерфейсе
  requirement: |
    Ошибки должны отображаться корректно и понятно для пользователя
  prerequisites: |
    - Корзина содержит товар
  test-data: |
    - Симулировать ошибку сервера (500)
  steps:
    - Перейти к оформлению заказа и симулировать ошибку сервера
  expected-result: |
    - Отображается сообщение об ошибке сервера, корзина сохраняет товары

- summary: |
    Проверка SPA-поведения
  requirement: |
    Приложение не должно перезагружать страницу при переходах
  prerequisites: |
    Открыта главная страница
  test-data: |
    Нет
  steps:
    - Перейти между разделами сайта
  expected-result: |
    Страница не перезагружается полностью

- summary: |
    Работа при медленном интернет-соединении
  requirement: |
    Сайт должен корректно работать при медленном интернет-соединении
  prerequisites: |
    Ограничена скорость сети
  test-data: |
    3G
  steps:
    - Открыть сайт
  expected-result: |
    Сайт загружается, отображается индикатор загрузки
    
- summary: |
    Проверка адаптивности интерфейса при узком разрешении
  requirement: |
    Интерфейс должен корректно отображаться при разных разрешениях экрана
  prerequisites: |
    Открыт сайт на ПК или мобильном устройстве
  test-data: |
    Разрешение окна = 375x812, 768x1024
  steps:
    - Уменьшить ширину окна браузера
    - Перейти на страницу товаров
    - Проверить расположение элементов
  expected-result: |
    Все элементы видимы, не перекрывают друг друга, кликабельны

- summary: |
    Проверка уменьшения количества товара после оформления заказа
  requirement: |
    После успешного оформления заказа количество заказанного товара на сайте должно уменьшаться на количество, которое пользователь купил.
  prerequisites: |
    На сайте есть товары с определённым количеством на складе
  test-data: |
    Пользователь добавил любой товар в корзину
  steps:
    - Перейти в корзину
    - Оформить заказ
    - После успешного оформления проверить количество товара на сайте 
  expected-result: |
    - Количество купленного товара уменьшилось в соответствии с оформленным заказом
