- summary: |
    Проверка кнопки сброса фильтров категории
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Выбрать любую категорию товаров
    3. Нажать на кнопку сброса катгории
  expected-result: |
    После сброса категории на странице отобразятся все товары магазина
  actual-result: |
    Кнопка сброса для категории отсутствует, необходимо перезагрузить страницу, чтобы сбросить фильтр по категориям

- summary: |
    Все чекбоксы имеют названия
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Проверить, что у всех чекбоксов для фильтрации по производителю есть названия
  expected-result: |
    Все чекбоксы для фильтрации по производителю имеют названия
  actual-result: |
    Чекбокс для товаров без конкретного производителя не имеет наименования

- summary: |
    Переключение языка интерфейса
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Нажать на кнопку выбора языка интерфейса
  expected-result: |
    Интерфейс отображается на выбранном языке, при перезагрузке страницы выбранный язык не сбрасывается
  actual-result: |
    При перезагрузке страницы русский язык сбрасывается на английский

- summary: |
    Проверка иконок языков интерфейса
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
