    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Отключить VPN на устройстве для тестирования
    2. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Проверить, что сайт магазина работает корректно
  expected-result: |
