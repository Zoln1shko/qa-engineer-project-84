- summary: |
    Поле "Максимальная цена" показывает случайное значение и допускает отрицательные числа
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Обратить внимание на подсказку (placeholder) в поле "Максимальная цена"
    3. Листать страницы каталога, сравнить подсказку на разных страницах
    4. Ввести отрицательное значение в поле "Максимальная цена"
  expected-result: |
    - Подсказка должна быть логичная и фиксированная на всех страницах каталога
    - В поле цены нельзя вводить отрицательные значения
    - Фильтр корректно ограничивает товары по цене
  actual-result: |
    - Подсказка меняется случайным образом на каждой странице каталога
    - Допускается ввод отрицательного значения для поля "Максимальная цена"
