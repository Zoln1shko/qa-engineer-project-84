- summary: |
    Проверка отображения количества товаров в корзине
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Добавить любое количество любого товара в корзину
    3. Перейти в корзину
    4. Проверить, что отображается только то количество товара, которое было добавлено пользователем
  expected-result: |
    Отображается только то количество товара, которое было добавлено пользователем
  actual-result: |
    Кроме количество товара, которое было добавлено пользователем, в корзине отображается количство товара доступное на сайте
    Скриншот cart_bug.png

- summary: |
    Переход к оформлению заказа
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Добавить любое количество любого товара в корзину
    3. Нажать на кнопку "Оформить заказ"
    4. Появляется окно "Заказ успешно оформлен"
    5. Данные передаются на сервер
  expected-result: |
    Заказ успешно оформлен, данные передаются на сервер
  actual-result: |
    Данные не передаются на сервер
    Скриншот order_bug.png

- summary: |
    Обработка ошибок в интерфейсе
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Добавить любое количество любого товара в корзину
    3. Нажать на кнопку "Оформить заказ"
    4. Имитировать ошибку сервера (500)
  expected-result: |
    Отображается сообщение об ошибке
    Корзина сохраняет добавленные товары
  actual-result: |
    Вместо сообщения об ошибке отображается "Заказ успешно оформлен"

- summary: |
    Проверка адаптивности интерфейса при узком разрешении
   environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Установить разрешение окна браузера = 375x812, 768x1024
    3. Перейти на главную страницу магазина/страницу корзины
    4. Проверить расположение элементов
  expected-result: |
    Все элементы видимы, не перекрывают друг друга, кликабельны
  actual-result: |
    Элементы интерфейса не помещаются на экране, перекрывают друг друга
    Скриншоты main_bug.png и cart2_bug

- summary: |
    Проверка уменьшения количества товара после оформления заказа
   environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Добавить любое количество любого товара в корзину
    3. Перейти в корзину
    4. Оформить заказ
    5. Перейти на главную страницу магазина
    6. Проверить, что количество ранее купленного товара корректно сократилось
  expected-result: |
    Количество ранее купленного товара корректно сократилось
  actual-result: |
    Невозможно проверить данный сценарий, т.к. заказ не оформляется. См. тест-кейс "Переход к оформлению заказа"
