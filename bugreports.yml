- summary: |
    Поиск товара по ключевому слову работает только на открытой странице каталога 
  environment: |
    Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
    OC Windows 11 Pro Версия 25H2
  steps-to-reproduce: |
    1. Зайти на страницу магазина https://products-store.hexlet.app/
    2. Ввести ключевое слово в строке поиска
  expected-result: |
    Отображается список товаров, соответствующих запросу
