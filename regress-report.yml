bugreports:
  - summary: |
      Поиск товара по несуществующему ключевому слову
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Вписать в поле поиска ключевое слово "poweder" 
      3. Проверить, что появляется сообщение "Товар не найден"
    expected-result: |
      При отсутствии товаров по запросу пользователь должен получить корректное сообщение
    actual-result: |
      Сообщения об отсутствии товара нет, вместо этого отображаются все товары магазина
  - summary: |
      Все чекбоксы имеют названия
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина
      https://products-store.hexlet.app/
      2. Проверить, что у всех чекбоксов для фильтрации по производителю есть названия
    expected-result: |
      Все чекбоксы для фильтрации по производителю имеют названия
    actual-result: |
      Чекбокс для товаров без конкретного производителя не имеет наименования
  - summary: |
      Несколько заданных одновременно фильтров корректно работают 
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Установить фильтр по категории и фильтр производитель
    expected-result: |
      Отображаются товары заданной категории выбранного производителя
    actual-result: |
      Товары отображаются некорректно, например в категории groceries при выборе любого непродуктового производителя подтягиваются товары из косметики и мебели
  - summary: |
      Переключение языка интерфейса
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Нажать на кнопку выбора языка интерфейса
    expected-result: |
      Интерфейс отображается на выбранном языке, при перезагрузке страницы выбранный язык не сбрасывается
    actual-result: |
      При перезагрузке страницы русский язык сбрасывается на английский
  - summary: |
      Проверка отображения количества товаров в корзине
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина
      https://products-store.hexlet.app/
      2. Добавить любое количество любого товара в корзину
      3. Перейти в корзину
      4. Проверить, что отображается только то количество товара, которое было добавлено пользователем
    expected-result: |
      Отображается только то количество товара, которое было добавлено пользователем
    actual-result: |
      Кроме количество товара, которое было добавлено пользователем, в корзине отображается количство товара доступное на сайте
      Скриншот cart_bug.png
  - summary: |
      Изменение количества товара
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Добавить любое количество любого товара в корзину
      3. Перейти в корзину
      4. Изменить количество товара в корзине
    expected-result: |
      Количество товара успешно меняется в меньшую и большую сторону
    actual-result: |
      Можно только удалять товар по одной штуке, добавить товар нельзя
  - summary: |
      Переход к оформлению заказа
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Добавить любое количество любого товара в корзину
      3. Перейти в корзину
      4. Нажать на кнопку "Оформить заказ"
      5. Появляется окно "Заказ успешно оформлен"
      6. Данные передаются на сервер
    expected-result: |
      Заказ успешно оформлен, данные передаются на сервер
    actual-result: |
      Данные не передаются на сервер
      Cкриншот order_bug.png
  - summary: |
      Обработка ошибок в интерфейсе
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Добавить любое количество любого товара в корзину
      3. Нажать на кнопку "Оформить заказ"
      4. Имитировать ошибку сервера (500)
    expected-result: |
      Отображается сообщение об ошибке
      Корзина сохраняет добавленные товары
    actual-result: |
      Вместо сообщения об ошибке отображается "Заказ успешно оформлен"
  - summary: |
      Проверка адаптивности интерфейса при узком разрешении
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store.hexlet.app/
      2. Установить разрешение окна браузера = 375x812, 768x1024
      3. Перейти на главную страницу магазина/страницу корзины
      4. Проверить расположение элементов
    expected-result: |
      Все элементы видимы, не перекрывают друг друга, кликабельны
    actual-result: |
      Элементы интерфейса не помещаются на экране, перекрывают друг друга
      Скриншоты main_bug.png и cart2_bug
  - summary: |
      Проверка уменьшения количества товара после оформления заказа
    requirement: |
      После успешного оформления заказа количество заказанного товара на сайте должно уменьшаться на количество, которое пользователь купил.
    prerequisites: |
      На сайте есть товары с определённым количеством на складе
    test-data: |
      Пользователь добавил любой товар в корзину
    steps-to-reproduce: |
      1. Перейти в корзину
      2. Оформить заказ
      3. После успешного оформлении проверить количество товара на сайте
    expected-result: |
      Количество купленного товара уменьшилось в соответствии с оформленным заказом
