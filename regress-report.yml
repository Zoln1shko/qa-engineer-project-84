bugreports:
  - summary: |
      Нет информации об ошибке при поиске по несуществующему ключевому слову
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store-v2.hexlet.app/
      2. Ввести несуществующее слово в строке поиска
    expected-result: |
      Выводится ошибка "Товар не найден"
    actual-result: |
      Нет инофрмации об ошибке, выводится список всех товаров

  - summary: |
      Отсутствие товаров в каталоге по сравнению с предыдущей версией сайта
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Зайти на страницу магазина https://products-store-v2.hexlet.app/
      2. Листать все страницы каталога
      3. Сравнить количство товаров текущей версии сайта и предыдущей
    expected-result: |
      Количество товаров совпадает
    actual-result: |
      В новой версии сайта гораздо меньше товаров

- summary: |
      Сброс выбранной категории блокирует возможность пролистывания страниц каталога
    environment: |
      Google Chrome 144.0.7559.97 (официальная сборка) (64 бит)
      OC Windows 11 Pro Версия 25H2
    steps-to-reproduce: |
      1. Открыть каталог товаров
      2. Выбрать любую категорию для фильтрации
      3. Сбросить фильтр выбрав пустую категорию
      4. Попытаться пролистать страницы каталога
    expected-result: |
      Возвращается полный список товаров, возможно постраничное пролистываение каталога
    actual-result: |
      Кнопки для пролистывания каталога отсутсвуют
